<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #FFFFFF; font-family: Arial, sans-serif; display: flex; }
.accent-bar { position: absolute; top: 0; left: 0; width: 100%; height: 3pt; background: #2D2D2D; }
.container { margin: 0; padding: 40pt 60pt 30pt 60pt; width: 600pt; }
.section-num { color: #999999; font-size: 11pt; margin: 0 0 4pt 0; letter-spacing: 2pt; }
.section-title { color: #2D2D2D; font-size: 24pt; font-weight: bold; margin: 0 0 20pt 0; }
.contributions-table { margin: 0 0 16pt 0; width: 100%; }
.ct-row { display: flex; border-bottom: 1pt solid #E0E0E0; padding: 7pt 0; }
.ct-row.ch-header { border-bottom: 2pt solid #2D2D2D; }
.ct-col1 { width: 50pt; }
.ct-col2 { width: 240pt; }
.ct-col3 { flex: 1; }
.ct-label { color: #2D2D2D; font-size: 10pt; font-weight: bold; }
.ct-name { color: #2D2D2D; font-size: 10pt; font-weight: bold; }
.ct-desc { color: #6B6B6B; font-size: 9pt; }
.ct-rq { color: #2D2D2D; font-size: 9pt; font-weight: bold; }
.timeline-box { background: #F5F5F5; border-radius: 6pt; padding: 12pt; display: flex; gap: 20pt; }
.timeline-item { text-align: center; }
.timeline-label { color: #6B6B6B; font-size: 9pt; margin: 0 0 4pt 0; }
.timeline-phase { color: #2D2D2D; font-size: 10pt; font-weight: bold; margin: 0; }
.footer { position: absolute; bottom: 16pt; left: 60pt; right: 60pt; color: #999999; font-size: 9pt; border-top: 1pt solid #E0E0E0; padding-top: 6pt; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="container">
  <p class="section-num">Section 05 — Contributions envisagées</p>
  <p class="section-title">Contributions Envisagées</p>
  <div class="contributions-table">
    <div class="ct-row ch-header">
      <p class="ct-col1 ct-label">ID</p>
      <p class="ct-col2 ct-label">Contribution</p>
      <p class="ct-col3 ct-label">Cible</p>
    </div>
    <div class="ct-row">
      <p class="ct-col1 ct-name">C1</p>
      <p class="ct-col2 ct-name">FedPEFT-TS</p>
      <p class="ct-col3 ct-rq">RQ1</p>
    </div>
    <div class="ct-row">
      <p class="ct-col1 ct-name">C2</p>
      <p class="ct-col2 ct-name">FedTS-Bench</p>
      <p class="ct-col3 ct-rq">RQ2</p>
    </div>
    <div class="ct-row">
      <p class="ct-col1 ct-name">C3</p>
      <p class="ct-col2 ct-name">FedTSFM-Arch</p>
      <p class="ct-col3 ct-rq">RQ3</p>
    </div>
    <div class="ct-row">
      <p class="ct-col1 ct-name">C4</p>
      <p class="ct-col2 ct-name">IndusFedFM</p>
      <p class="ct-col3 ct-rq">RQ4</p>
    </div>
  </div>
  <div class="timeline-box">
    <div class="timeline-item">
      <p class="timeline-label">Année 1-2</p>
      <p class="timeline-phase">C1 + C2</p>
    </div>
    <div class="timeline-item">
      <p class="timeline-label">Année 2-3</p>
      <p class="timeline-phase">C3</p>
    </div>
    <div class="timeline-item">
      <p class="timeline-label">Année 3</p>
      <p class="timeline-phase">C4</p>
    </div>
  </div>
</div>
<div class="footer"><span>15</span><span>Rapport d'avancement de thèse — Y. AMMOURI</span></div>
</body>
</html>
