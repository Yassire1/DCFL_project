[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windturbine-fl"
version = "1.0.0"
description = "Federated Learning for Wind Turbine Predictive Maintenance with CNN+LSTM"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.18.0",
    "flwr-datasets[vision]>=0.5.0",
    "tensorflow>=2.9.1, != 2.11.1 ; platform_machine != 'arm64'",
    "tensorflow-macos>=2.9.1, != 2.11.1 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "wandb>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "WindSight"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3  # Reduced for memory testing
local-epochs = 1
batch-size = 16  # Reduced from 32 to save memory
fraction-fit = 1.0  # Include all 3 clients in training
fraction-evaluate = 1.0
use-wandb = false  # Disable wandb for memory testing


